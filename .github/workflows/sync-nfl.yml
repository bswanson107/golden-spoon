name: Sync NFL Data

on:
  schedule:
    # Game days (Thu–Mon UTC): scores, odds moves, and kickoff win-% locks.
    - cron: '*/15 * * * 0,1,4,5,6'
    # Tue–Wed have no games, but nflverse posts the next week's moneylines
    # Tuesday afternoon ET — without this the new week stays blank until Thursday.
    - cron: '*/30 * * * 2,3'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync nflverse → Supabase
        run: npm run sync:nfl
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
